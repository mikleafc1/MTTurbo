name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: darya-sync
        run: go build -trimpath -ldflags "-s -w" -o DaryaSync.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaryaSync.exe
          path: darya-sync/DaryaSync.exe
